name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Integration-level CI for the Codecube game: does the game assemble, and is
# its own code clean? Linting and unit-testing the codeblock mod is that mod's
# own repository's job - see mods/codeblock/.github/workflows/ci.yml - so this
# workflow does not duplicate it, and this repository's status does not turn red
# because of a submodule's internals.

jobs:
  integration:
    name: game assembles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The checks below verify the submodules are populated, so they have
          # to actually be fetched.
          submodules: recursive

      - name: Check game structure
        run: bash scripts/check_game.sh

  lint:
    name: luacheck (game mods)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@v4

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Lint the game's own mods
        run: |
          # A glob over the game's own mods, not ".": gh-actions-luarocks
          # installs a .luarocks tree into the workspace and "." would lint the
          # toolchain itself. "mods/cc_*" cannot reach it, and unlike a hardcoded
          # list it picks up a new game mod on the day it is added - which is how
          # this job once passed without reading cc_gui at all (B57). The two
          # submodules, codeblock and vector3, carry no cc_ prefix and stay out.
          mods=(mods/cc_*/)
          # An empty glob would leave the literal pattern and lint nothing, so
          # fail loudly rather than pass on having read no code.
          if [ ${#mods[@]} -eq 0 ] || [ ! -d "${mods[0]}" ]; then
            echo "::error::no mods/cc_*/ directories found - nothing was linted"
            exit 1
          fi
          echo "Linting: ${mods[*]}"
          luacheck "${mods[@]}" \
            --formatter plain --codes > luacheck.txt 2>&1 || true
          cat luacheck.txt
          # Re-emit findings as inline annotations: they show on the diff in a
          # PR, and are readable through the public check-runs API, which the
          # raw job log is not.
          sed -nE 's#^([^:]+):([0-9]+):([0-9]+): (.*)$#::error file=\1,line=\2::\4#p' luacheck.txt
          if grep -qE '^[^:]+:[0-9]+:[0-9]+: ' luacheck.txt; then
            exit 1
          fi
          if grep -qiE 'error|cannot|could not|unknown' luacheck.txt; then
            echo "::error::luacheck did not report findings but failed: $(head -c 800 luacheck.txt | tr '\n' ' ')"
            exit 1
          fi
